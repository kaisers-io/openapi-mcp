name: bench
on:
  push: { branches: [main] }
  pull_request:
    # Docs-only changes cannot move a benchmark; skip the 45-minute job for them
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
# PR-controlled code runs here (install/build/benchmark) — keep the ambient token read-only.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Performance regression gate (issue #80). On a pull request the PR base is built in the SAME job and
# both builds are benchmarked interleaved on this one runner, so the comparison is relative and the
# runner's speed cancels out (absolute timings from another machine would be noise). Machine-independent
# metrics (tools/list bytes) are also checked against the committed scripts/bench/baseline.json. On a
# push to main the suite runs without a base, for the artefact and the baseline check.
# Actions are SHA-pinned, credentials are not persisted, and no dependency lifecycle script runs — the
# same conventions as ci.yml.
jobs:
  bench:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: check out the PR base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .bench-base
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts && pnpm build
      - name: build the PR base
        if: github.event_name == 'pull_request'
        working-directory: .bench-base
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm build
      - name: benchmark
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          if [ "$IS_PR" = true ]; then
            node scripts/bench/run.ts --runs 5 --out bench-report.json \
              --cli head=packages/cli/bin/openapi-mcp.mjs \
              --cli base=.bench-base/packages/cli/bin/openapi-mcp.mjs
          else
            node scripts/bench/run.ts --runs 5 --out bench-report.json
          fi
      - name: compare
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          if [ "$IS_PR" = true ]; then
            node scripts/bench/compare.ts bench-report.json --base base --baseline scripts/bench/baseline.json
          else
            node scripts/bench/compare.ts bench-report.json --baseline scripts/bench/baseline.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-report
          path: bench-report.json
          if-no-files-found: ignore
