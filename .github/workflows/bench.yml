name: bench
on:
  push: { branches: [main] }
  pull_request:
# PR-controlled code runs here (install/build/benchmark) — keep the ambient token read-only.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Performance regression gate (issue kaisers-io/openapi-mcp-archive#80). On a pull request the PR
# base is built in the SAME job and both builds are benchmarked interleaved on this one runner, so
# the comparison is relative and the runner's speed cancels out (absolute timings from another machine
# would be noise). Machine-independent metrics (tools/list bytes) are also checked against the
# committed scripts/bench/baseline.json. On a push to main the suite runs without a base, for the
# artefact and the baseline check. Actions are SHA-pinned, credentials are not persisted, and no
# dependency lifecycle script runs — the same conventions as ci.yml.
jobs:
  bench:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Depth 2: the merge commit's first parent is the base, for the docs-only check below
        with: { persist-credentials: false, fetch-depth: 2 }
      # Docs-only changes cannot move a benchmark, so the job skips the 45-minute measurement for
      # them. It still runs and passes, because `bench` is a required check: a workflow skipped
      # by `paths-ignore` never reports, and the pull request could not be merged.
      - name: detect docs-only changes
        id: changes
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          measure=true
          # The list is read in full first: `grep -q` stopping early would fail the pipe
          changed=$(git diff --name-only HEAD^1 HEAD)
          if [ "$IS_PR" = true ] && ! grep -qvE '(\.md$|^docs/|^LICENSE$)' <<< "$changed"; then
            measure=false
            echo "docs-only change: the benchmark is skipped"
          fi
          echo "measure=$measure" >> "$GITHUB_OUTPUT"
      - name: check out the PR base
        if: github.event_name == 'pull_request' && steps.changes.outputs.measure == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .bench-base
          persist-credentials: false
      - if: steps.changes.outputs.measure == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.changes.outputs.measure == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - if: steps.changes.outputs.measure == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm build
      - name: build the PR base
        if: github.event_name == 'pull_request' && steps.changes.outputs.measure == 'true'
        working-directory: .bench-base
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm build
      - name: benchmark
        if: steps.changes.outputs.measure == 'true'
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          if [ "$IS_PR" = true ]; then
            node scripts/bench/run.ts --runs 5 --out bench-report.json \
              --cli head=packages/cli/bin/openapi-mcp.mjs \
              --cli base=.bench-base/packages/cli/bin/openapi-mcp.mjs
          else
            node scripts/bench/run.ts --runs 5 --out bench-report.json
          fi
      - name: compare
        if: steps.changes.outputs.measure == 'true'
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          if [ "$IS_PR" = true ]; then
            node scripts/bench/compare.ts bench-report.json --base base --baseline scripts/bench/baseline.json
          else
            node scripts/bench/compare.ts bench-report.json --baseline scripts/bench/baseline.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-report
          path: bench-report.json
          if-no-files-found: ignore
