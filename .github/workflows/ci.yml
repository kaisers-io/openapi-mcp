name: ci
on:
  push: { branches: [main] }
  pull_request:
# PR-controlled code runs in every job (install/build/test) — keep the ambient token read-only.
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  bundle-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check-bundle-determinism.sh
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: smoke-test the globally-installed bin
        run: |
          set -euo pipefail
          npm pack ./packages/cli --pack-destination /tmp
          npm install -g /tmp/kaisers-io-openapi-mcp-*.tgz
          openapi-mcp --version
          openapi-mcp --json doctor
# NOTE: no publish job here — publishing lives in release.yml (tag-triggered, OIDC).
