name: ci
on:
  push: { branches: [main] }
  pull_request:
# PR-controlled code runs in every job (install/build/test) — keep the ambient token read-only.
permissions:
  contents: read
# A newer push supersedes the previous run on the same ref, so cancel it instead of letting the whole
# matrix finish. This includes main: when several PRs are merged in a row, only the newest main commit
# needs a complete result, because each merged PR was already tested on top of everything before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Supply-chain conventions shared by every job (same as release.yml):
# - Actions are pinned to full commit SHAs (a tag can be moved by its owner or by whoever compromises
#   it); the `# vX.Y.Z` comment is what Dependabot (.github/dependabot.yml) reads to bump the pin.
# - `persist-credentials: false`: no job pushes or fetches after checkout, so the GITHUB_TOKEN is not
#   left in .git/config where PR-controlled code (tests, build tooling) could read it.
# - `pnpm install --ignore-scripts`: no dependency lifecycle script runs. Nothing in the lockfile needs
#   one (native tools — oxlint, oxfmt, rolldown, typescript — ship as prebuilt optionalDependencies),
#   and pnpm's own build-script allow-list would block them anyway; this makes the intent explicit and
#   independent of that config.
# - No dependency cache (`package-manager-cache: false`): a fresh `pnpm install` takes a few seconds,
#   and restoring the cached store failed on macOS runners ("Egress is over the account limit") and
#   then stalled setup-node for about ten minutes before it continued without the cache.
# - `timeout-minutes` on every job: the GitHub default is 6 hours, which a hung subprocess test would burn.
jobs:
  check:
    timeout-minutes: 20
    strategy:
      # An empty `node` falls back to .node-version (the dev pin); 24.11.0 and 22.19.0 are the floors of
      # the two supported lines in the published engines range (^22.19.0 || >=24.11.0).
      # macOS runs on every pull request and on main: the repository is public, so hosted runners
      # cost nothing, and the platform-specific code paths (fsync, compile cache) are gated per change.
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['', '24.11.0', '22.19.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ matrix.node }}', node-version-file: .node-version, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
  # Windows runs the whole test suite on the dev Node pin, on every pull request and on main, so a
  # change to platform-specific code (paths, the cache's filesystem adapter, the bin stub, process
  # handling) is tested on Windows before it merges.
  # It runs `pnpm test`, not `pnpm check`: lint, formatting, types and coverage do not depend on the OS
  # and are already gated by the ubuntu job above, while subprocess coverage would be incomplete here
  # (ChildProcess#kill() terminates a Windows child abruptly, so it writes no V8 coverage).
  windows:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
  # Every version site (packages/cli/package.json, the README and docs pins, the doctor example) must
  # declare the same version; see scripts/versions/run.ts. All of them are knowable on a PR, so drift
  # is caught here rather than at release time. Plain Node, no install, one platform. The script's
  # own tests run with the rest of the suite in `pnpm check`.
  versions:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - run: node scripts/versions/run.ts --check
  bundle-determinism:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: bash scripts/check-bundle-determinism.sh
  # The packed tarball is installed globally and driven through the installed bin on every supported
  # platform: on Windows that path goes through npm's `.cmd` shim, which no other job exercises.
  smoke:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile --ignore-scripts && pnpm build
      - name: smoke-test the globally-installed bin
        # The "ad-hoc" install is the tarball packed one line above from this checkout (it has no
        # dependencies of its own) — not a registry package outside the lockfile.
        run: | # zizmor: ignore[adhoc-packages]
          set -euo pipefail
          # A workspace-relative destination: the same spelling works in every runner's bash
          mkdir -p .smoke
          npm pack ./packages/cli --pack-destination .smoke
          npm install -g ./.smoke/kaisers-io-openapi-mcp-*.tgz
          bash scripts/smoke-cli.sh
  # The dependency audit is NOT here: it lives in audit.yml (weekly on main, on demand, and on PRs that
  # change dependencies), so a new advisory cannot turn every open PR red overnight.
  # Lints the workflows themselves (template injection, credential persistence, unpinned `uses:` —
  # zizmor's default policy requires every action to be SHA-pinned, so an unpinned ref fails here).
  zizmor:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # `advanced-security: false`: report to the log and fail the job on findings, instead of uploading
      # SARIF to code scanning (SARIF mode never fails the job, so a finding would not block a merge).
      # The action installs zizmor from a hash-pinned wheel lock for the exact version below.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true
          version: 1.31.1
# NOTE: no publish job here — publishing lives in release.yml (tag-triggered, OIDC).
