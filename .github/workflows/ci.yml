name: ci
on:
  push: { branches: [main] }
  pull_request:
# PR-controlled code runs in every job (install/build/test) — keep the ambient token read-only.
permissions:
  contents: read
# A newer push to a pull request makes the older run's answer moot, so that run is cancelled.
# Every other run (a push to main) gets a group of its own, the run id, and is never cancelled or
# replaced, so every main commit keeps a complete result to bisect with and to tag a release on.
# A shared group would not do even without cancel-in-progress: GitHub keeps at most one run pending
# per group and cancels the pending one a newer run displaces. bench.yml, codeql.yml and audit.yml
# use the same block.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
# Supply-chain conventions shared by every job (same as release.yml):
# - Actions are pinned to full commit SHAs (a tag can be moved by its owner or by whoever compromises
#   it); the `# vX.Y.Z` comment is what Dependabot (.github/dependabot.yml) reads to bump the pin.
# - `persist-credentials: false`: no job pushes or fetches after checkout, so the GITHUB_TOKEN is not
#   left in .git/config where PR-controlled code (tests, build tooling) could read it.
# - Plain `pnpm install`, without `--ignore-scripts`: no dependency lifecycle script runs, because
#   pnpm builds only the packages listed in `allowBuilds` (none) and `strictDepBuilds: true` in
#   pnpm-workspace.yaml makes the install fail on any other package that has one. Nothing in the
#   lockfile needs one (native tools — oxlint, oxfmt, rolldown, typescript — ship as prebuilt
#   optionalDependencies). `--ignore-scripts` would skip that failure silently, so a dependency
#   update that starts to need a build script would pass here unnoticed. release.yml keeps the
#   flag: by tag time the same lockfile has passed CI without it.
# - No dependency cache (`package-manager-cache: false`): a fresh `pnpm install` takes a few seconds,
#   and restoring the cached store failed on macOS runners ("Egress is over the account limit") and
#   then stalled setup-node for about ten minutes before it continued without the cache.
# - `timeout-minutes` on every job: the GitHub default is 6 hours, which a hung subprocess test would burn.
#   Each limit is about twice the slowest recent run, and at least 5 minutes. A job that hits one is a
#   regression to look into; raise the limit only once the job is known to need longer.
jobs:
  check:
    timeout-minutes: 20
    strategy:
      # An empty `node` falls back to .node-version (the dev pin); 24.11.0 and 22.19.0 are the floors of
      # the two supported lines in the published engines range (^22.19.0 || >=24.11.0). '26' is the
      # newest LTS line, which >=24.11.0 also admits; it takes the latest 26.x release.
      # macOS runs on every pull request and on main: the repository is public, so hosted runners
      # cost nothing, and the platform-specific code paths (fsync, compile cache) are gated per change.
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['', '26', '24.11.0', '22.19.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ matrix.node }}', node-version-file: .node-version, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  # Windows runs the whole test suite on the dev Node pin, on every pull request and on main, so a
  # change to platform-specific code (paths, the cache's filesystem adapter, the bin stub, process
  # handling) is tested on Windows before it merges.
  # It runs `pnpm test`, not `pnpm check`: lint, formatting, types and coverage do not depend on the OS
  # and are already gated by the ubuntu job above, while subprocess coverage would be incomplete here
  # (ChildProcess#kill() terminates a Windows child abruptly, so it writes no V8 coverage).
  windows:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  # --allow and --deny against the real GitHub, Stripe and DigitalOcean specs, through the real CLI over
  # MCP stdio, on every platform (packages/cli/test/filters-real-specs.test.ts). The specs are downloaded
  # from commit-pinned URLs and checked against a pinned sha256 (scripts/bench/public-specs.ts); about
  # 23 MB per run, no cache, so a poisoned cache can never feed the check. A failed download fails the job.
  filters-real-specs:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:real-specs
  # Every version site (packages/cli/package.json, the README and docs pins, the doctor example) must
  # declare the same version; see scripts/versions/run.ts. All of them are knowable on a PR, so drift
  # is caught here rather than at release time. Plain Node, no install, one platform. The script's
  # own tests run with the rest of the suite in `pnpm check`.
  versions:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - run: node scripts/versions/run.ts --check
  bundle-determinism:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check-bundle-determinism.sh
  # The packed tarball is installed globally and driven through the installed bin on every supported
  # platform: on Windows that path goes through npm's `.cmd` shim, which no other job exercises.
  smoke:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: smoke-test the globally-installed bin
        # The "ad-hoc" install is the tarball packed one line above from this checkout (it has no
        # dependencies of its own) — not a registry package outside the lockfile.
        run: | # zizmor: ignore[adhoc-packages]
          set -euo pipefail
          # A workspace-relative destination: the same spelling works in every runner's bash
          mkdir -p .smoke
          npm pack ./packages/cli --pack-destination .smoke
          npm install -g ./.smoke/kaisers-io-openapi-mcp-*.tgz
          bash scripts/smoke-cli.sh
  # The official MCP Inspector CLI lists and calls the tools of the built server in both protocol eras
  # (scripts/inspector/run.ts). The Inspector is pinned in its own lockfile, outside the workspace, and
  # installed without lifecycle scripts. Linux only: the transport is stdio JSON-RPC, which the
  # per-platform suites already cover.
  inspector:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: npm ci --prefix scripts/inspector --ignore-scripts --no-audit --no-fund
      - run: node scripts/inspector/run.ts
  # The dependency audit is NOT here: it lives in audit.yml (weekly on main, on demand, and on PRs that
  # change dependencies), so a new advisory cannot turn every open PR red overnight.
  # Lints the workflows themselves (template injection, credential persistence, unpinned `uses:` —
  # zizmor's default policy requires every action to be SHA-pinned, so an unpinned ref fails here).
  zizmor:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # zizmor runs directly instead of through zizmorcore/zizmor-action, because the action cannot
      # pass --strict-collection (zizmorcore/zizmor-action#141). Without the flag, a file zizmor
      # cannot load (syntax newer than this zizmor, or a file GitHub tolerates but zizmor cannot
      # parse) is skipped with a warning, and the job still passes with that file unaudited. The cost
      # is a red job when GitHub adds syntax this version does not know; the fix then is a version
      # bump, not an exception.
      # The wheel is pinned by version and sha256 (the manylinux x86_64 wheel, the same hash as the
      # action's own lock for this version) and installed with --require-hashes, as the action does.
      # Dependabot cannot see this pin: it is bumped by hand (CONTRIBUTING.md, "Tool pins bumped by
      # hand"). `--format github` writes findings as annotations and fails the job on any finding.
      # GH_TOKEN enables the online audits, as the action does by default.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --no-deps --only-binary :all: --require-hashes \
            -r /dev/stdin <<'REQUIREMENTS'
          zizmor==1.31.1 --hash=sha256:58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410
          REQUIREMENTS
          "$RUNNER_TEMP/zizmor/bin/zizmor" --version
          "$RUNNER_TEMP/zizmor/bin/zizmor" --strict-collection --format github .
# NOTE: no publish job here — publishing lives in release.yml (tag-triggered, OIDC).
