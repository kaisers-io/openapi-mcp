name: ci
on:
  push: { branches: [main] }
  pull_request:
# PR-controlled code runs in every job (install/build/test) — keep the ambient token read-only.
permissions:
  contents: read
# A newer push supersedes the previous run on the same ref, so cancel it instead of letting the whole
# matrix finish. This includes main: when several PRs are merged in a row, only the newest main commit
# needs a complete result, because each merged PR was already tested on top of everything before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Supply-chain conventions shared by every job (same as release.yml):
# - Actions are pinned to full commit SHAs (a tag can be moved by its owner or by whoever compromises
#   it); the `# vX.Y.Z` comment is what Dependabot (.github/dependabot.yml) reads to bump the pin.
# - `persist-credentials: false`: no job pushes or fetches after checkout, so the GITHUB_TOKEN is not
#   left in .git/config where PR-controlled code (tests, build tooling) could read it.
# - `pnpm install --ignore-scripts`: no dependency lifecycle script runs. Nothing in the lockfile needs
#   one (native tools — oxlint, oxfmt, rolldown, typescript — ship as prebuilt optionalDependencies),
#   and pnpm's own build-script allow-list would block them anyway; this makes the intent explicit and
#   independent of that config.
# - `timeout-minutes` on every job: the GitHub default is 6 hours, which a hung subprocess test would burn.
jobs:
  check:
    timeout-minutes: 20
    strategy:
      # An empty `node` falls back to .node-version (the dev pin); 24.11.0 and 22.19.0 are the floors of
      # the two supported lines in the published engines range (^22.19.0 || >=24.11.0).
      # macOS runs on main only: on a private repository its minutes are billed at ten times the Linux
      # rate, and the platform-specific code paths (fsync, compile cache) rarely change in a PR.
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        node: ['', '24.11.0', '22.19.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ matrix.node }}', node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
  bundle-determinism:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: bash scripts/check-bundle-determinism.sh
  smoke:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts && pnpm build
      - name: smoke-test the globally-installed bin
        # The "ad-hoc" install is the tarball packed one line above from this checkout (it has no
        # dependencies of its own) — not a registry package outside the lockfile.
        run: | # zizmor: ignore[adhoc-packages]
          set -euo pipefail
          npm pack ./packages/cli --pack-destination /tmp
          npm install -g /tmp/kaisers-io-openapi-mcp-*.tgz
          bash scripts/smoke-cli.sh
  # The dependency audit is NOT here: it lives in audit.yml (weekly on main, on demand, and on PRs that
  # change dependencies), so a new advisory cannot turn every open PR red overnight.
  # Lints the workflows themselves (template injection, credential persistence, unpinned `uses:` —
  # zizmor's default policy requires every action to be SHA-pinned, so an unpinned ref fails here).
  zizmor:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # `advanced-security: false`: report to the log and fail the job on findings, instead of uploading
      # SARIF to code scanning (unavailable while the repo is private, and SARIF mode never fails the job).
      # The action installs zizmor from a hash-pinned wheel lock for the exact version below.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true
          version: 1.31.1
# NOTE: no publish job here — publishing lives in release.yml (tag-triggered, OIDC).
