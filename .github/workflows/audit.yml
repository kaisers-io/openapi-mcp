name: audit
# Dependency audit against the live advisory database. It is deliberately NOT part of ci.yml and must not
# be a required PR check: a new advisory for an unrelated transitive package would otherwise turn every
# open PR red overnight without any change in the PR. Instead it runs weekly on main, on demand, and on
# PRs that change the dependency set (where a finding is about that PR). What to do when it fails:
# CONTRIBUTING.md, "Dependency audit".
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC; scheduled runs always use the default branch (main)
  workflow_dispatch:
  pull_request:
    paths: [pnpm-lock.yaml, pnpm-workspace.yaml, '**/package.json', .github/workflows/audit.yml]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version }
      # Reads pnpm-lock.yaml only (no install needed). Deliberately NOT `--prod`: the published CLI bundles
      # its runtime dependencies into dist/ from its *devDependencies* (commander, undici, …), so a
      # prod-only audit would skip exactly the code that ships. Dev tooling is in scope too — CI runs it.
      # This also covers transitive dependencies, which GitHub's dependency graph does not currently
      # read from pnpm 12's multi-document lockfile (so Dependabot alerts cannot see them).
      # An accepted advisory is added below as `--ignore GHSA-…` with a comment giving the reason and a
      # review-by date (see the playbook in CONTRIBUTING.md, "Dependency audit").
      - run: pnpm audit --audit-level=high
