name: release
on:
  push:
    tags: ['v*']
# No pull_request/workflow_dispatch trigger — the only way to reach the `publish` job (which mints an
# npm OIDC token) is a tag push, and only after the `verify` job passes.
permissions:
  contents: read
jobs:
  # Gate: re-runs the full CI check suite against the exact tagged commit, plus release-only guards
  # (tag/version match, branch containment, changelog heading, version newer than npm's `latest`,
  # tarball content allowlist) and a smoke test of the packed tarball. Holds only read permissions — no publish credentials live here. This is also where the CLI
  # bundle is built: `dist/openapi-mcp.mjs` is gitignored build output (not committed; `bin/openapi-mcp.mjs`
  # is the committed stub), so this unprivileged job builds it, proves the build is reproducible, guards
  # its shape, and hands it to `publish` as a workflow artifact.
  verify:
    runs-on: ubuntu-latest
    # A clean verify run takes under 2 minutes; this only bounds a hang (GitHub's default is 6 hours).
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Credentials stay persisted here (unlike every other checkout): the "reachable from origin/main"
      # guard below runs `git fetch`, which needs the token while the repository is private. The token
      # is `contents: read` only, and the only artifact this job uploads is the bundle directory
      # (packages/cli/dist, build output only), so the token cannot leak through it (the risk
      # zizmor's artipacked audit is about).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 } # zizmor: ignore[artipacked]
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No `cache: pnpm` in this workflow (unlike ci.yml): a poisoned or stale restore-key cache is a
      # plausible supply-chain vector for the one workflow with publish reach, so the release pipeline
      # always installs clean.
      # `package-manager-cache: false` makes "no cache" explicit: setup-node auto-enables caching when
      # package.json's packageManager is npm (it is pnpm today, so nothing is cached yet) — this keeps a
      # future packageManager change from silently turning a cache on in the release pipeline.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, package-manager-cache: false }
      - name: Guard — tag matches packages/cli/package.json version
        # `github.ref_name` is attacker-controlled text once the repo is public (anyone who can push a
        # tag controls it) — it goes into env, never directly into the script body, so it can't be
        # spliced into the shell command.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG (version $VERSION) does not match packages/cli/package.json version $PKG_VERSION" >&2
            exit 1
          fi
          echo "tag $TAG matches package version $PKG_VERSION"
      - name: Guard — tagged commit is reachable from origin/main
        # A tag pushed from a random branch/fork must not be able to publish. `GITHUB_SHA` is the
        # runner-assigned commit SHA (not attacker-suppliable text like ref_name), so it's safe to
        # reference directly.
        run: |
          set -euo pipefail
          # No --depth here: a shallow fetch would write .git/shallow and narrow the ancestor check to
          # "tag is the exact current tip" — tagging an older main commit must stay legal.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tagged commit $GITHUB_SHA is not reachable from origin/main — refusing to publish from a stray branch" >&2
            exit 1
          fi
      - name: Guard — every version site declares this CLI version
        # Which files carry the version and why they must agree: see scripts/versions/run.ts.
        # `--check` also runs on every PR (ci.yml `versions`), so by tag time this is a
        # re-assertion. Placed after the origin/main containment guard and before `pnpm install`: it
        # needs no dependencies, and repo-controlled code runs only once the commit is known to be
        # reachable from main.
        run: node scripts/versions/run.ts --check
      - name: Guard — CHANGELOG.md has a heading for the released version
        # `--check` cannot require this (on a PR the top section is `## [Unreleased]`), but a tag
        # can: `pnpm versions --set` writes the heading, so a missing one means the release entries
        # are still under `## [Unreleased]`. `TAG` goes through env, as in the first guard.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! grep -qF "## [$VERSION] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION] - <date>' heading — the entry for this release is probably still under '## [Unreleased]'" >&2
            exit 1
          fi
          echo "CHANGELOG.md has a heading for $VERSION"
      - name: Guard — this version is newer than the one npm serves as latest
        # `pnpm versions --set` refuses a non-newer version, but only against the version in the
        # checkout it runs in; this is the registry-side check. npm 11 already refuses to publish a
        # version below the current stable `latest` on the implicit tag, so this is a stricter
        # restatement rather than the only thing in the way: the registry's own check can be
        # bypassed with an explicit `--tag` or `--force`, and this one cannot be, from an honest
        # release.
        #
        # It matters because the ancestor guard above deliberately allows tagging an OLDER main
        # commit: a lower version prepared on main and never published would pass every other guard
        # here, and new installs of `@kaisers-io/openapi-mcp` would get it.
        #
        # This guard is in the tagged tree, like every other one, so it constrains an honest release
        # and not an adversarial tag. The gate that does not live here is the Environment on
        # `publish` — see CONTRIBUTING.md, "Releasing". `TAG` goes through env, as in the first guard.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # Fails closed: a DNS failure, a timeout or a registry outage must not read as "nothing is
          # published yet". Only a lookup that SUCCEEDS and reports no version is a first publication.
          if ! LOOKUP="$(npm view @kaisers-io/openapi-mcp@latest version --registry=https://registry.npmjs.org 2>&1)"; then
            case "$LOOKUP" in
              *E404*) LOOKUP='' ;;
              *) echo "::error::could not read the published version from npm: $LOOKUP" >&2; exit 1 ;;
            esac
          fi
          LATEST="$(printf '%s' "$LOOKUP" | tail -n 1)"
          if [ -z "$LATEST" ]; then
            echo "npm reports no published release yet — nothing to compare against"
            exit 0
          fi
          # The script is JavaScript: its `${...}` are template literals, not shell expansions.
          # shellcheck disable=SC2016
          node -e '
            const [version, latest] = process.argv.slice(1);
            // Canonical three-part decimal only. A prerelease is deliberately refused rather than
            // ordered: this workflow publishes stable releases, and guessing an order for
            // `1.0.0-rc.1` is how a release goes out under the wrong dist-tag. `1..1` and
            // `Infinity.0.0` are refused for the same reason — `Number()` accepts both.
            const CANONICAL = /^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/u;
            const parse = (value, what) => {
              if (!CANONICAL.test(value)) {
                console.error(`::error::${what} ${value} is not a plain x.y.z version`);
                process.exit(1);
              }
              return value.split(".").map(Number);
            };
            const candidate = parse(version, "the tagged version");
            const published = parse(latest, "the published version");
            const at = candidate.findIndex((part, index) => part !== published[index]);
            if (at === -1 || candidate[at] < published[at]) {
              console.error(`::error::${version} is not newer than the published latest ${latest} — refusing to move latest backwards`);
              process.exit(1);
            }
            console.log(`${version} is newer than the published latest ${latest}`);
          ' "$VERSION" "$LATEST"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm build
      - run: bash scripts/check-bundle-determinism.sh
      - name: Guard — pack the tarball, verify its contents, smoke-test the install
        # The `npm install -g` below installs the tarball packed in this step (it has no dependencies of
        # its own) — not a registry package outside the lockfile.
        run: | # zizmor: ignore[adhoc-packages]
          set -euo pipefail
          PACK_DIR="$(mktemp -d)"
          # --ignore-scripts: the prepack hook (tsdown) writes its progress to stdout, which
          # corrupts the --json output this guard parses. dist/ is already built and
          # determinism-checked by the preceding steps, so skipping prepack loses nothing.
          PACK_JSON="$(npm pack ./packages/cli --json --ignore-scripts --pack-destination "$PACK_DIR")"
          # Regression net for "no source code in the tarball": the tarball must contain EXACTLY this
          # file set — extras (leaked source) and missing files (dropped LICENSE/README) both fail.
          # Shipping a new file requires deliberately updating this set. dist/ holds the entry plus
          # the chunks its dynamic imports split off (content-hashed names, issue #91), so its part
          # of the set is exactly what the determinism-checked build above wrote there. The script's
          # `${...}` are JavaScript template literals, not shell expansions.
          # shellcheck disable=SC2016
          node -e '
            const { readdirSync } = require("node:fs");
            const pack = JSON.parse(process.argv[1])[0];
            const dist = readdirSync("packages/cli/dist", { recursive: true, withFileTypes: true })
              .filter((entry) => entry.isFile())
              .map((entry) => `${entry.parentPath.slice("packages/cli/".length)}/${entry.name}`);
            if (!dist.includes("dist/openapi-mcp.mjs") || !dist.every((path) => /^dist\/[\w-]+\.mjs$/.test(path))) {
              console.error("unexpected build output in packages/cli/dist:", dist.join(", "));
              process.exit(1);
            }
            const expected = ["CHANGELOG.md", "LICENSE", "README.md", "bin/openapi-mcp.mjs", "package.json", ...dist].sort();
            const actual = pack.files.map((f) => f.path).sort();
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              console.error("tarball shape mismatch — expected exactly:", expected.join(", "));
              console.error("actual:", actual.join(", "));
              process.exit(1);
            }
            console.log("tarball contents OK:", actual.join(", "));
          ' "$PACK_JSON"
          TARBALL="$PACK_DIR/$(node -e 'console.log(JSON.parse(process.argv[1])[0].filename)' "$PACK_JSON")"
          PREFIX="$(mktemp -d)"
          npm install -g --prefix "$PREFIX" "$TARBALL"
          export PATH="$PREFIX/bin:$PATH"
          bash scripts/smoke-cli.sh
      - name: Upload the built CLI bundle for the publish job
        # This is the ONLY channel that gets the bundle (`dist/openapi-mcp.mjs` and the chunks it
        # imports) into `publish`: the artifact built, determinism-checked, and shape-guarded above by
        # this unprivileged (no id-token) job. The whole directory goes: the entry alone would publish
        # a CLI that fails on its first dynamic import.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-bundle
          path: packages/cli/dist
          if-no-files-found: error
          retention-days: 1
  # Publish: the only job with OIDC (`id-token: write`) reach. Runs only after `verify` passes, against
  # the same tagged commit. Deliberately minimal: the published bundle is the artifact `verify` built,
  # determinism-checked, and shape-guarded — downloaded here, not rebuilt — so no dependency install and
  # no build runs while the OIDC permission is in scope. Any step in a job can mint the job's OIDC
  # identity, so repo-controlled build tooling must never execute here.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    # The one gate a tag's own tree cannot supply. Everything else authorizing this release — every
    # guard in `verify`, the `needs` edge above, this `permissions` block — is content of the pushed
    # ref, because GitHub resolves a push-triggered workflow from that ref. A tag whose tree deletes
    # them is never subjected to them.
    #
    # An Environment moves the gate into repository settings, which a tag cannot edit: protection
    # rules (required reviewers, a deployment branch/tag restriction) are evaluated by GitHub before
    # the job starts. Deleting this key from a tag's tree does not evade it either, as long as the npm
    # Trusted Publisher entry names the same environment — npm then refuses a token minted without
    # it. Both halves have to be configured outside this file; see CONTRIBUTING.md, "Releasing".
    environment: npm-publish
    # A publish takes seconds; this only bounds a hung registry call (GitHub's default is 6 hours).
    timeout-minutes: 10
    permissions:
      id-token: write # npm Trusted Publishing (OIDC) — see the publish step
      contents: read
    steps:
      - name: Guard — a provenance attestation needs a public repository
        # The `--provenance` flag below hard-fails on the prerequisites npm checks (`id-token`, the CI
        # provider, npm package visibility) but never on repository visibility: npm looks at that only
        # on its automatic path, which stating the flag bypasses. From a private repository the
        # publish would still sign — attesting to a source URL nobody can resolve and writing the
        # private repository's name into the public transparency log. Refuse here instead, while
        # nothing has left the runner.
        #
        # Written fail-closed on purpose. An `if:` condition on the payload value would skip this step
        # silently if the field were ever absent, which is the failure mode it exists to prevent — so
        # an empty value is an error too, and only a literal `false` passes.
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "${REPO_PRIVATE:-}" != "false" ]; then
            echo "::error::Repository visibility reads '${REPO_PRIVATE:-<absent>}', expected 'false'. A provenance attestation would name a repository nobody can resolve. Refusing to publish." >&2
            exit 1
          fi
          echo "repository is public — provenance can be attested"
      # No git operation follows, so the token is not persisted into .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # See the verify job: never let setup-node turn on a dependency cache in the release pipeline.
          package-manager-cache: false
          # Required for npm's Trusted Publishing (OIDC) exchange to target the right registry — npm CLI
          # >= 11.5.1 is required, which is what ships with the pinned Node version above (node v24.22.1
          # bundles npm 11.19.1).
          registry-url: 'https://registry.npmjs.org'
      - name: Download the CLI bundle built by the unprivileged verify job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-bundle
          path: packages/cli/dist
      - name: Guard — restore the executable bit stripped by artifact zipping
        # actions/upload-artifact zips its payload, and zip does not preserve Unix mode bits — every file
        # lands back at plain 644. Re-apply the mode tsdown set at build time and confirm it stuck.
        run: |
          set -euo pipefail
          chmod 755 packages/cli/dist/openapi-mcp.mjs
          test -x packages/cli/dist/openapi-mcp.mjs
      - name: Publish to npm via Trusted Publishing (OIDC)
        working-directory: packages/cli
        # No NPM_TOKEN / secrets.* anywhere: authentication is the short-lived OIDC token GitHub mints
        # from `id-token: write` above, exchanged by npm CLI for a publish token. This requires a
        # ONE-TIME manual step by the package owner: configure this repo + this exact workflow file + the
        # `npm-publish` environment as a Trusted Publisher for `@kaisers-io/openapi-mcp` on npmjs.com
        # (CONTRIBUTING.md, "Releasing", says why the environment must be named). Until that is done, this step
        # fails with an auth error — expected and safe (there is no fallback long-lived token to leak).
        # `--ignore-scripts`: no lifecycle scripts run at publish time.
        # `--provenance`: Trusted Publishing attaches an attestation on its own, but only when the
        # source repository is public, and that check fails in silence — a release from a private
        # repository simply ships without one
        # (https://docs.npmjs.com/trusted-publishers#automatic-provenance-generation). Stating the flag
        # skips that automatic path and hard-fails instead on the prerequisites this job does control:
        # `id-token: write`, a supported CI provider, a public npm package. It does not re-check
        # repository visibility; the first step of this job does.
        run: npm publish --ignore-scripts --provenance

  # The GitHub release entry. Separate from `publish` on purpose: creating one needs `contents: write`,
  # and the publish job is deliberately the narrowest thing in this repository — it holds
  # `id-token: write`, runs no repository-controlled code, and installs nothing. Handing it write
  # access to the repository as well would undo that. This job holds the other half instead, and
  # never sees the npm identity.
  #
  # `contents: write` is the narrowest scope GitHub offers for creating a release, not a scope limited
  # to releases: it also permits pushing to unprotected branches and creating or deleting tags. That
  # is why `--verify-tag` below is not decoration.
  #
  # `needs: publish` so a failed publish leaves no release entry announcing something that never
  # shipped. The reverse gap is the tolerable one: a published package with no release entry is
  # visible and can be fixed by hand.
  announce:
    needs: publish
    runs-on: ubuntu-latest
    # Two API calls; this only bounds a hang (GitHub's default is 6 hours).
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only CHANGELOG.md is read; `gh` below authenticates through GH_TOKEN, not .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Extract this version's changelog section as the release notes
        # `verify` already proved the heading exists, so a missing section here means the two jobs
        # disagree about the tag — worth failing on rather than publishing an empty release body.
        # `TAG` goes through env, never spliced into the script (same reasoning as in `verify`).
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          awk -v heading="## [$VERSION] - " '
            index($0, heading) == 1 { capturing = 1; next }
            capturing && /^## \[/ { exit }
            capturing { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          # Not `test -s`: a heading followed straight by the next one captures the blank line between
          # them, which is a nonempty file and an empty release. `verify` proves the heading exists,
          # not that anything was written under it.
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::the changelog section for $VERSION is empty or missing — nothing to put in the release" >&2
            exit 1
          fi
          echo "release notes: $(wc -l < "$RUNNER_TEMP/release-notes.md") lines"
      - name: Create the release
        # Notes come from the changelog rather than `--generate-notes`: the changelog is written for
        # the people a release affects, and a list of commit subjects is not.
        #
        # `--verify-tag` matters more than it looks. Without it, `gh release create` CREATES a missing
        # tag, pointing at the default branch's current head — so this sequence would fabricate one:
        # publish succeeds, this job fails, someone deletes the tag while sorting that out, then
        # re-runs the failed job. `needs` is already satisfied by the successful publish in the same
        # run, so this job would run alone and resurrect the tag on whatever `main` points at by then
        # — a commit `verify` never checked, wearing the released version's name. With the flag it
        # fails instead, which is the only acceptable outcome.
        #
        # Latest: gh sends no `make_latest`, and the API defaults it to true, so whatever this creates
        # becomes Latest. Correct for a forward release, which the version-regression guard in
        # `verify` enforces.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
